<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Paraketa Menü</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;600&display=swap">
<style>
/* Tek sütun, telefon odaklı; masadan QR okutulduğunda açılan karşılama ekranı */
:root{
  --bg:#f6f3ee; --fg:#22201c; --muted:#6f6a61; --line:#ddd6ca; --accent:#a4492f;
  --display:"Fraunces", Georgia, serif; --body:"Karla", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1916;--fg:#efe9df;--muted:#a59e92;--line:#3a352e;--accent:#e08a6c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1916;--fg:#efe9df;--muted:#a59e92;--line:#3a352e;--accent:#e08a6c;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{min-height:100%;max-width:30rem;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:1.25rem;padding-block:3rem;text-align:left}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,9vw,3rem);line-height:1.05;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted);max-width:34ch}
hr{border:0;border-top:1px solid var(--line);width:100%;margin:.5rem 0}
.note{font-size:.875rem}
*{box-sizing:border-box}body{margin:0}
</style></head><body>
<main>
  <span class="eyebrow">Paraketa · Menü</span>
  <h1>Menümüz çok yakında burada.</h1>
  <p>Yeni menümüzü hazırlıyoruz. Bu arada siparişiniz için garsonumuzdan yardım isteyebilirsiniz.</p>
  <hr>
  <p class="note">Afiyet olsun.</p>
</main>
</body></html>
